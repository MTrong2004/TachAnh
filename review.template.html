<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Duyệt element</title>
<style>
:root {
  --paper-l: #f6f5f1; --paper-d: #17181a;
  --panel-l: #ffffff; --panel-d: #212326;
  --ink-l: #1b1c1e; --ink-d: #ecedee;
  --muted-l: #5d6066; --muted-d: #a3a7ad;
  --line-l: #d5d6d9; --line-d: #3a3d42;
  --accent-l: #1c6b3a; --accent-d: #6fd08f;
  --on-accent-l: #ffffff; --on-accent-d: #0d1a11;

  --paper: var(--paper-l); --panel: var(--panel-l); --ink: var(--ink-l); --muted: var(--muted-l);
  --line: var(--line-l); --accent: var(--accent-l); --on-accent: var(--on-accent-l);
  @media (prefers-color-scheme: dark) {
    --paper: var(--paper-d); --panel: var(--panel-d); --ink: var(--ink-d); --muted: var(--muted-d);
    --line: var(--line-d); --accent: var(--accent-d); --on-accent: var(--on-accent-d);
  }
  @supports (color: light-dark(white, black)) {
    --paper: light-dark(var(--paper-l), var(--paper-d));
    --panel: light-dark(var(--panel-l), var(--panel-d));
    --ink: light-dark(var(--ink-l), var(--ink-d));
    --muted: light-dark(var(--muted-l), var(--muted-d));
    --line: light-dark(var(--line-l), var(--line-d));
    --accent: light-dark(var(--accent-l), var(--accent-d));
    --on-accent: light-dark(var(--on-accent-l), var(--on-accent-d));
  }
  color-scheme: light dark;
  accent-color: var(--accent);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px; min-height: 100dvh; }
@media (max-width: 860px) { .app { grid-template-columns: minmax(0, 1fr); } }
h1 { font-size: 18px; margin: 0 0 4px; text-wrap: balance; }
.hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; text-wrap: pretty; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
button, select, input { font: inherit; color: inherit; }
.bar button, .save {
  min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer;
}
.bar button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.bar button[aria-disabled="true"] { opacity: .5; cursor: default; }
.bar .primary, .save { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
canvas { display: block; max-width: 100%; max-height: calc(100dvh - 190px); width: auto; height: auto; margin-inline: auto; border-radius: 6px; cursor: crosshair; touch-action: manipulation; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; align-self: start; position: sticky; top: 16px; max-height: calc(100dvh - 32px); display: flex; flex-direction: column; }
.side h2 { font-size: 15px; margin: 0 0 8px; }
.list { list-style: none; margin: 0 0 12px; padding: 0; overflow: auto; flex: 1; }
.list li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.list li[data-sel="1"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.pick { width: 44px; height: 44px; grid-row: span 2; border: 2px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--swatch); }
.list input, .list select { min-height: 36px; width: 100%; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); font-size: 14px; }
.list .desc { grid-column: 2; }
.status { font-size: 13px; color: var(--muted); min-height: 20px; margin: 8px 0 0; }
.save { width: 100%; }
</style>
</head>
<body>
<div class="app">
  <main>
    <h1>Duyệt element của ảnh</h1>
    <p class="hint">Bấm vào ảnh để chọn nhiều nhóm, rồi bấm «Gộp thành một element». Muốn tách một nhóm, bật «Chọn từng mảnh», chọn mảnh cần lấy ra rồi gộp.</p>
    <div class="bar" role="toolbar" focusgroup="toolbar wrap" aria-label="Thao tác với vùng chọn" aria-controls="view">
      <button type="button" id="bMerge" class="primary" aria-disabled="true">Gộp thành một element</button>
      <button type="button" id="bClear" aria-disabled="true">Bỏ chọn</button>
      <button type="button" id="bPiece" aria-pressed="false">Chọn từng mảnh</button>
      <button type="button" id="bTint" aria-pressed="true">Tô màu nhóm</button>
      <button type="button" id="bReset">Về gợi ý ban đầu</button>
    </div>
    <div class="stage"><canvas id="view" aria-label="Ảnh gốc, mỗi nhóm một màu"></canvas></div>
  </main>
  <aside class="side">
    <h2 id="count">Nhóm</h2>
    <ul class="list" id="list"></ul>
    <button type="button" class="save" id="bSave">Lưu file nhóm</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </aside>
</div>
<script>
const DATA = /*__DATA__*/null;
const MODES = [["keep", "Giữ ảnh gốc"], ["regen", "Vẽ lại"], ["bg", "Là nền"]];
const $ = (id) => document.getElementById(id);
const view = $("view"), ctx = view.getContext("2d", { willReadFrequently: true });
const { w: W, h: H } = DATA;
view.width = W; view.height = H;

let base, part;                 // điểm ảnh gốc, id mảnh của từng điểm ảnh
let groups = [], partGroup;     // groups[i] = {name, mode, parts, hue}
let sel = new Set(), hover = -1, pieceMode = false, tint = true, hueN = 0;

const loadImg = (src) => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });
const pixels = (im) => { const c = new OffscreenCanvas(W, H), x = c.getContext("2d"); x.imageSmoothingEnabled = false; x.drawImage(im, 0, 0); return x.getImageData(0, 0, W, H).data; };
const nextHue = () => (hueN++ * 137.508) % 360;
function rgbOf(hue) {
  const f = (n) => { const k = (n + hue / 30) % 12; return Math.round(255 * (0.55 - 0.45 * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return [f(0), f(8), f(4)];
}

function setGroups(list) {
  hueN = 0;
  groups = list.map((g) => ({ name: g.name, mode: g.mode || "keep", desc: g.desc || "", parts: [...g.parts], hue: nextHue() }));
  index(); sel.clear(); renderList(); draw();
}
function index() {
  groups = groups.filter((g) => g.parts.length);
  partGroup.fill(-1);
  groups.forEach((g, i) => g.parts.forEach((p) => (partGroup[p] = i)));
}

function draw() {
  const out = new ImageData(W, H), o = out.data;
  const cols = groups.map((g) => (g.mode === "bg" ? [90, 90, 90] : rgbOf(g.hue)));
  for (let i = 0, p = 0; i < o.length; i += 4, p++) {
    const id = part[p], g = id ? partGroup[id] : -1;
    let a = 0;
    if (g >= 0) a = sel.has(id) ? 0.78 : g === hover ? 0.55 : tint ? 0.32 : 0;
    const c = g >= 0 ? cols[g] : [0, 0, 0];
    o[i] = base[i] * (1 - a) + c[0] * a; o[i + 1] = base[i + 1] * (1 - a) + c[1] * a; o[i + 2] = base[i + 2] * (1 - a) + c[2] * a; o[i + 3] = 255;
  }
  ctx.putImageData(out, 0, 0);
}

function renderList() {
  const list = $("list");
  list.textContent = "";
  $("count").textContent = `${groups.length} nhóm`;
  const total = W * H, areas = new Float64Array(groups.length);
  for (let p = 0; p < part.length; p++) { const g = part[p] ? partGroup[part[p]] : -1; if (g >= 0) areas[g]++; }
  groups.map((g, i) => i).sort((a, b) => areas[b] - areas[a]).forEach((i) => {
    const g = groups[i], li = document.createElement("li");
    li.dataset.g = i;
    const pick = document.createElement("button");
    pick.type = "button"; pick.className = "pick";
    pick.style.setProperty("--swatch", `rgb(${rgbOf(g.hue).join(" ")})`);
    pick.setAttribute("aria-label", `Chọn nhóm ${g.name}, chiếm ${(100 * areas[i] / total).toFixed(1)}% ảnh`);
    pick.addEventListener("click", () => toggleGroup(i));
    const name = document.createElement("input");
    name.value = g.name; name.setAttribute("aria-label", "Tên element");
    name.addEventListener("change", () => { g.name = name.value.trim() || g.name; name.value = g.name; persist(); });
    const mode = document.createElement("select");
    mode.setAttribute("aria-label", `Cách xử lý ${g.name}`);
    MODES.forEach(([v, t]) => mode.add(new Option(t, v, false, v === g.mode)));
    const desc = document.createElement("input");
    desc.value = g.desc; desc.placeholder = "Mô tả vật để vẽ lại, vd: cái loa cầm tay";
    desc.setAttribute("aria-label", `Mô tả ${g.name} để vẽ lại`);
    desc.className = "desc"; desc.hidden = g.mode !== "regen";
    desc.addEventListener("change", () => { g.desc = desc.value.trim(); persist(); });
    mode.addEventListener("change", () => { g.mode = mode.value; desc.hidden = g.mode !== "regen"; persist(); draw(); });
    li.append(pick, name, mode, desc);
    list.append(li);
  });
  markRows();
}
function markRows() {
  for (const li of $("list").children) li.dataset.sel = groups[li.dataset.g].parts.some((p) => sel.has(p)) ? "1" : "0";
  const none = sel.size === 0;
  $("bMerge").setAttribute("aria-disabled", none);
  $("bClear").setAttribute("aria-disabled", none);
}

function toggleGroup(i) {
  const ps = groups[i].parts, on = ps.every((p) => sel.has(p));
  ps.forEach((p) => (on ? sel.delete(p) : sel.add(p)));
  markRows(); draw();
}
function merge() {
  if (!sel.size) return;
  const ids = [...sel], touched = [...new Set(ids.map((p) => partGroup[p]))];
  const whole = touched.filter((i) => groups[i].parts.every((p) => sel.has(p)));
  const keep = whole.length ? groups[whole[0]] : null;       // giữ tên, màu của nhóm bị lấy trọn đầu tiên
  touched.forEach((i) => (groups[i].parts = groups[i].parts.filter((p) => !sel.has(p))));
  groups.push({ name: keep ? keep.name : `nhom-${groups.length + 1}`, desc: keep ? keep.desc : "", mode: keep && keep.mode !== "bg" ? keep.mode : "keep", parts: ids, hue: keep ? keep.hue : nextHue() });
  index(); sel.clear(); renderList(); draw(); persist();
  say(`Đã gộp ${ids.length} mảnh thành một element.`);
}
function clearSel() { sel.clear(); markRows(); draw(); }

const say = (t) => ($("status").textContent = t);
function persist() { try { localStorage.setItem(DATA.key, JSON.stringify(groups.map(({ name, mode, desc, parts }) => ({ name, mode, desc, parts })))); } catch {} }
function restore() { try { return JSON.parse(localStorage.getItem(DATA.key)); } catch { return null; } }

function at(e) {
  const r = view.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) * W / r.width), y = Math.floor((e.clientY - r.top) * H / r.height);
  return x < 0 || y < 0 || x >= W || y >= H ? 0 : part[y * W + x];
}
view.addEventListener("pointermove", (e) => {
  const id = at(e), g = id ? partGroup[id] : -1;
  if (g !== hover) { hover = g; draw(); }
});
view.addEventListener("pointerleave", () => { if (hover !== -1) { hover = -1; draw(); } });
view.addEventListener("click", (e) => {
  const id = at(e);
  if (!id || partGroup[id] < 0) return;
  if (pieceMode) { sel.has(id) ? sel.delete(id) : sel.add(id); markRows(); draw(); }
  else toggleGroup(partGroup[id]);
});

const live = (b) => b.getAttribute("aria-disabled") !== "true";
$("bMerge").addEventListener("click", (e) => live(e.currentTarget) && merge());
$("bClear").addEventListener("click", (e) => live(e.currentTarget) && clearSel());
$("bPiece").addEventListener("click", (e) => { pieceMode = !pieceMode; e.currentTarget.setAttribute("aria-pressed", pieceMode); });
$("bTint").addEventListener("click", (e) => { tint = !tint; e.currentTarget.setAttribute("aria-pressed", tint); draw(); });
$("bReset").addEventListener("click", () => { setGroups(DATA.groups); persist(); say("Đã về gợi ý ban đầu."); });
$("bSave").addEventListener("click", () => {
  const body = JSON.stringify({ groups: groups.map(({ name, mode, desc, parts }) => ({ name, mode, desc, parts })) }, null, 1);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([body], { type: "application/json" }));
  a.download = "groups.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  say("Đã lưu groups.json. Chép file vào thư mục kết quả rồi chạy bước xuất.");
});
document.addEventListener("keydown", (e) => {
  if (e.isComposing || e.keyCode === 229 || e.target.matches("input, select, textarea")) return;
  if (e.key === "g" || e.key === "G") merge();
  else if (e.key === "Escape") clearSel();
});

// Thanh công cụ: một điểm dừng Tab, mũi tên trái/phải để chuyển nút (khi trình duyệt chưa có focusgroup)
if (!("focusGroup" in HTMLElement.prototype)) {
  const bar = document.querySelector('[role="toolbar"]'), items = [...bar.querySelectorAll("button")];
  items.forEach((b, i) => (b.tabIndex = i ? -1 : 0));
  bar.addEventListener("focusin", ({ target }) => { if (items.includes(target)) items.forEach((b) => (b.tabIndex = b === target ? 0 : -1)); });
  bar.addEventListener("keydown", (e) => {
    const i = items.indexOf(document.activeElement);
    const to = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: items.length - 1 }[e.key];
    if (i < 0 || to === undefined) return;
    e.preventDefault();
    items[(to + items.length) % items.length].focus();
  });
}

Promise.all([loadImg(DATA.src), loadImg(DATA.labels)]).then(([a, b]) => {
  base = pixels(a);
  const lab = pixels(b);
  part = new Uint16Array(W * H);
  let max = 0;
  for (let p = 0, i = 0; p < part.length; p++, i += 4) { part[p] = lab[i] | (lab[i + 1] << 8); if (part[p] > max) max = part[p]; }
  partGroup = new Int32Array(max + 1);
  const saved = restore();
  setGroups(saved && saved.length ? saved : DATA.groups);
  if (saved && saved.length) say("Đã mở lại phần đang làm dở.");
});
</script>
</body>
</html>
